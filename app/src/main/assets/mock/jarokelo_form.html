<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8"><title>Járókelő mock</title></head>
<body>
  <h1>Probléma bejelentése (mock)</h1>
  <label for="name">Probléma tárgya</label>
  <input id="name" name="name" type="text" />
  <label for="description">Probléma leírása</label>
  <textarea id="description" name="description" rows="4" placeholder="Az általam tapasztalt probléma..."></textarea>
  <label>Képek csatolása
    <input type="file" accept="image/*" multiple class="sr-only" />
  </label>
  <button type="button">Bejelentés küldése</button>
</body></html>
